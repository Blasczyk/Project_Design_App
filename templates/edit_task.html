
{% extends "base.html" %}

{% block title %}Edit Task{% endblock %}

{% block content %}

<div class="container mt-4">

    <h1>Edit Task</h1>

    <p class="text-muted">
        Project: {{ project["title"] }}
    </p>

    <form method="POST">

        <!-- Task Title -->
        <div class="mb-3">
            <label for="title" class="form-label">
                Task Title
            </label>

            <input
                type="text"
                id="title"
                name="title"
                class="form-control"
                value="{{ task['title'] }}"
                maxlength="200"
                required
            >
        </div>

        <!-- Description -->
        <div class="mb-3">
            <label for="description" class="form-label">
                Description
            </label>

            <textarea
                id="description"
                name="description"
                class="form-control"
                rows="4"
                maxlength="5000"
            >{{ task["description"] }}</textarea>
        </div>

        <!-- Priority -->
        <div class="mb-3">
            <label for="priority" class="form-label">
                Priority
            </label>

            <select
                id="priority"
                name="priority"
                class="form-select"
            >
                {% for priority in ['low', 'medium', 'high'] %}
                    <option
                        value="{{ priority }}"
                        {% if task['priority'] == priority %}
                            selected
                        {% endif %}
                    >
                        {{ priority | title }}
                    </option>
                {% endfor %}
            </select>
        </div>

        <!-- Stage -->
        <div class="mb-3">
            <label for="stage" class="form-label">
                Stage
            </label>

            <select
                id="stage"
                name="stage"
                class="form-select"
            >
                {% for stage in ['Implementation', 'Testing', 'Documentation'] %}
                    <option
                        value="{{ stage }}"
                        {% if task['stage'] == stage %}
                            selected
                        {% endif %}
                    >
                        {{ stage }}
                    </option>
                {% endfor %}
            </select>
        </div>

        <!-- Actions -->
        <button type="submit" class="btn btn-primary">
            Save Changes
        </button>

        <a
            href="{{ url_for('execution', project_id=project['id']) }}"
            class="btn btn-secondary"
        >
            Cancel
        </a>

    </form>

</div>

{% endblock %}
