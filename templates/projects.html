<!DOCTYPE html>
<html>
<head>
    <title>Project Designer</title>
    <meta charset="UTF-8">
    <meta name="description" content="Project Planner">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Daniel Blasczyk">

    <!-- CSS -->
    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/main.css') }}"
    >
</head>

<body>
    <header>
        <h1>Projects</h1>
    </header>
    <section>
        <h2>Project List</h2>

        <ul>
            {% for project in projects %}
                <li>
                    <!-- Project link -->
                    <a href="{{ url_for('project_dashboard', project_id=project.id) }}">
                        {{ project.title }}
                    </a>

                    <!-- Delete project -->
                    <form
                        action="{{ url_for('delete_project_route', project_id=project.id) }}"
                        method="POST"
                        onsubmit="return confirm('Are you sure you want to delete this project?');"
                    >
                        <button type="submit">Delete</button>
                    </form>
                </li>
            {% endfor %}
        </ul>

        <h3>Create New Project</h3>
        <a href = "/projects/new">New Project</a>
    </section>  
</body>
</html>
