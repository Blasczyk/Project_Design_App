```html
<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Project Designer</title>
        <meta charset="UTF-8">
        <meta name="description" content="Project Planner">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="author" content="Daniel Blasczyk">

        <!-- CSS -->
        <link
            rel="stylesheet"
            href="{{ url_for('static', filename='css/main.css') }}"
        >
    </head>

    <body>
        <header>
            <h1>Project Designer</h1>

            <nav class="project_steps">
                <ul>
                    <li><a href="{{ url_for('index') }}">Overview</a></li>
                    <li><a href="{{ url_for('design') }}">Design</a></li>
                    <li><a href="{{ url_for('build') }}">Build Plan</a></li>
                    <li><a href="{{ url_for('log') }}">Build Log</a></li>
                    <li><a href="{{ url_for('learning') }}">Learning</a></li>
                    <li><a href="{{ url_for('testing') }}">Testing</a></li>
                    <li><a href="{{ url_for('write_up') }}">Project Write-Up</a></li>
                    <li><a href="{{ url_for('retrospective') }}">Retrospective</a></li>
                    <li><a href="{{ url_for('interview_prep') }}">Interview Preparation</a></li>
                </ul>
            </nav>
        </header>

        <main>
            <section>
                <h2>Overview</h2>

                <form method="POST">
                    <div>
                        <label for="project_title">
                            What is this project building?
                        </label>

                        <input
                            type="text"
                            id="project_title"
                            name="project_title"
                            required
                        >
                    </div>

                    <div>
                        <h2>Project Description</h2>

                        <label for="project_description">
                            Give a short one- to two-sentence description of your project.
                        </label>

                        <textarea
                            id="project_description"
                            name="project_description"
                            rows="4"
                            required
                        ></textarea>
                    </div>

                    <div>
                        <h2>Why This Project?</h2>

                        <label for="project_reason">
                            What capability are you trying to develop?
                        </label>

                        <textarea
                            id="project_reason"
                            name="project_reason"
                            rows="4"
                            required
                        ></textarea>
                    </div>

                    <div>
                        <h2>Success Criteria</h2>

                        <label for="success_criteria">
                            This project is complete when...
                        </label>

                        <textarea
                            id="success_criteria"
                            name="success_criteria"
                            rows="4"
                            required
                        ></textarea>
                    </div>

                    <button type="submit">Save Overview</button>
                </form>
            </section>
        </main>

        <footer></footer>
    </body>
</html>
```
